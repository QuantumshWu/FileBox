# XcodeGen spec. CI runs `xcodegen generate` to create FileBox.xcodeproj, so no Mac is needed locally.
# Never change the bundle IDs: every new ID costs one of the free Apple ID's 10 App IDs per week.
# Entitlements files are named Support/<target>.entitlements; CI fake-signs each binary with its own.
name: FileBox
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FileBox:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.quantumshwu.filebox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/FileBox-Info.plist
      properties:
        CFBundleDisplayName: FileBox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [zh-Hans, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files stay private: the app's folders are NOT shown in the Files app.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        # List FileBox under "Open in / Copy to" for any file, even without the share extension.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
        # Picture in Picture and playback with the app in the background.
        UIBackgroundModes: [audio]
        NSPhotoLibraryAddUsageDescription: 用于把文件保存到「照片」
        NSPhotoLibraryUsageDescription: 用于在导入后从「照片」删除原件
        NSMicrophoneUsageDescription: 录屏时可以同时录下麦克风的声音
        NSLocalNetworkUsageDescription: Wi-Fi 传输需要让同一网络里的电脑访问 FileBox
    entitlements:
      path: Support/FileBox.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.quantumshwu.filebox]
    dependencies:
      - target: FileBoxShare
      - target: FileBoxRecord
  FileBoxShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.quantumshwu.filebox.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Support/FileBoxShare-Info.plist
      properties:
        CFBundleDisplayName: FileBox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [zh-Hans, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 100
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Support/FileBoxShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.quantumshwu.filebox]
  FileBoxRecord:
    type: app-extension
    platform: iOS
    sources: [RecordExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.quantumshwu.filebox.record
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Support/FileBoxRecord-Info.plist
      properties:
        CFBundleDisplayName: FileBox 录屏
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [zh-Hans, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Support/FileBoxRecord.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.quantumshwu.filebox]
schemes:
  FileBox:
    build:
      targets:
        FileBox: all
        FileBoxShare: all
        FileBoxRecord: all
    archive:
      config: Release
